# BEGIN promen-guard
# Инцидент 2026-09-24, см. INCIDENT-2026-09-24.md. Правила стоят до WordPress:
# отказ здесь не запускает PHP и не трогает базу. Только mod_rewrite — он
# разрешён в .htaccess этого хостинга (на нём работает блок WordPress).
<IfModule mod_rewrite.c>
RewriteEngine On
# Сборщик ByteDance не читает robots.txt и ходит потоком (343 запроса за утро сбоя).
RewriteCond %{HTTP_USER_AGENT} Bytespider [NC]
RewriteRule ^ - [F,L]
# XML-RPC сайту не нужен (robots.txt его закрывает), а это вход для перебора паролей.
RewriteRule ^xmlrpc\.php$ - [F,L,NC]
# Служебные файлы ядра и резервные копии (wp-config.php.bak лежит в корне) не отдаются.
RewriteRule (^|/)(readme\.html|license\.txt|wp-config-sample\.php)$ - [F,L,NC]
RewriteRule \.(bak|old|orig|save|swp|sql|tar|tgz|log|sh|dist)$ - [F,L,NC]
</IfModule>
# END promen-guard
