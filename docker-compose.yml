volumes:
  # WP-ядро и плагины: named volume (ext4 внутри VM) вместо bind-mount NTFS —
  # иначе opcache stat'ит сотни PHP-файлов через NTFS-прослойку (~4с TTFB).
  # Тема и mu-plugins остаются bind-mount ниже — live-правки работают как раньше.
  wpcore:

services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - ./.docker/db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 10

  meilisearch:
    # 1.11 снята с поддержки (CVE-2026-57823/57824 закрыты в 1.47.1/1.48.2);
    # поддерживается только последний релиз. При апгрейде мажора данные
    # пересоздаются: wp promen search-reindex (данные-истина — канон-таблица).
    image: getmeili/meilisearch:v1.48
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: promen_dev_key
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - ./.docker/meili:/meili_data

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_started
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      PROMEN_MEILI_URL: http://meilisearch:7700
      PROMEN_MEILI_KEY: promen_dev_key
      # Ключ API «Деловых Линий» — из .env рядом с compose-файлом (в git не попадает).
      PROMEN_DELLIN_APPKEY: ${PROMEN_DELLIN_APPKEY:-}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_MEMORY_LIMIT', '512M');
        define('WP_ENVIRONMENT_TYPE', 'local');
    volumes:
      - wpcore:/var/www/html
      - ./wp-content/themes/promen:/var/www/html/wp-content/themes/promen
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      # CSV и PDF пайплайна доступны изнутри контейнера для импорта:
      - ../normatives:/data/normatives:ro
      - ./products-csv:/data/products-csv:ro

  wpcli:
    image: wordpress:cli-php8.3
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_started
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      PROMEN_MEILI_URL: http://meilisearch:7700
      PROMEN_MEILI_KEY: promen_dev_key
      PROMEN_DELLIN_APPKEY: ${PROMEN_DELLIN_APPKEY:-}
    volumes:
      - wpcore:/var/www/html
      - ./wp-content/themes/promen:/var/www/html/wp-content/themes/promen
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./scripts:/scripts
      - ../normatives:/data/normatives:ro
      - ./products-csv:/data/products-csv:ro
      - ./content:/data/content:ro
    entrypoint: ["wp"]
    command: ["--info"]
